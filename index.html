<style>
/* Layout: a handmade recipe book on grainy flecked paper. One column (max 720px), faint 32px rules, a fixed paper tab strip at the bottom.
   Recipes are irregular hand-thrown plates (Carmen de Viboral motifs in earthy oxides + cobalt, japandi marks, peltre for soups)
   with a loose cobalt or oxblood line drawing laid over them, slightly off-register like a two-ink print. Single light look by request. */
:root {
  color-scheme: light;
  --paper: #EEE7D9;
  --paper-2: #E5DCCB;
  --rule: rgb(43 69 160 / 0.09);
  --ink: #2A2622;
  --muted: #7A7064;
  --cobalt: #2B45A0;
  --oxblood: #8E2F22;
  --terracotta: #A8653A;
  --olive: #6F6A3A;
  --ochre: #B08A3A;
  --linen: #D8CEBC;
  --glaze: #F4EEE2;
  --shadow: rgb(90 70 40 / 0.20);
  --spring: #6F6A3A; --summer: #A8653A; --fall: #8E2F22; --winter: #2B45A0;
  --hand: "Nothing You Could Do", "Bradley Hand", "Segoe Print", cursive;
  --serif: "EB Garamond", Garamond, "Times New Roman", serif;
  --pen: "Nanum Pen Script", "Bradley Hand", "Segoe Print", cursive;
  --rh: 32px;
}
* { box-sizing: border-box; }
body {
  margin: 0; color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.55;
  background-color: var(--paper);
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.55 0'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='0.35'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='310' height='290'><g fill='%237a5a3a'><circle cx='23' cy='41' r='0.9' opacity='.5'/><circle cx='190' cy='22' r='0.7' opacity='.4'/><circle cx='120' cy='140' r='1.1' opacity='.35'/><circle cx='270' cy='200' r='0.8' opacity='.5'/><circle cx='60' cy='250' r='0.6' opacity='.45'/><circle cx='240' cy='90' r='1' opacity='.3'/><path d='M150 60c3 1 5 3 6 6' stroke='%237a5a3a' stroke-width='.5' fill='none' opacity='.4'/><path d='M40 160c2-2 5-2 7 0' stroke='%237a5a3a' stroke-width='.5' fill='none' opacity='.35'/></g></svg>");
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(78px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1.5px dashed var(--cobalt); outline-offset: 3px; }

.page {
  max-width: 720px; margin: 0 auto; min-height: 100vh;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
/* ruled writing lines live only where there is writing; text sits on them */
/* inline bits (small units, italic notes, converted temps) must never make a row taller than one line */
.ruled small, .ruled i, .ruled .conv, .ruled .from, .ruled .q, .ruled b { line-height: 1; }
.ruled > li { line-height: var(--rh); }
.ruled { --line: rgb(43 69 160 / 0.16); line-height: var(--rh);
  background: repeating-linear-gradient(to bottom, transparent 0 calc(var(--rh) - 1px), var(--line) calc(var(--rh) - 1px) var(--rh)) 0 -3px; }
.caps { font-family: var(--serif); font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; font-weight: 500; color: var(--muted); }
.ital { font-family: var(--serif); font-style: italic; color: var(--muted); }

/* header */
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 22px; }
.mark { display: flex; align-items: center; gap: 10px; color: var(--cobalt); text-decoration: none; }
.mark svg { width: 148px; height: 60.5px; flex: none; display: block; }
.mark b { font-family: "Italiana", var(--serif); font-weight: 400; font-size: 32px; line-height: 1; letter-spacing: 0.16em; }
.tagline { margin: 6px 0 0; font-family: var(--serif); font-style: italic; color: var(--terracotta); }
.head-r { display: flex; align-items: center; gap: 10px; }
.units { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.units button { border: 0; background: none; padding: 2px 6px; font-family: var(--serif); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
.units button[aria-pressed="true"] { color: var(--ink); border-radius: 48% 52% 45% 55% / 60% 40% 60% 40%; box-shadow: 0 0 0 1.2px var(--ink); }
.gear { border: 0; background: none; width: 34px; height: 34px; padding: 4px; color: var(--ink); }
.sub { margin: 6px 0 0; }

.search { width: 100%; border: 0; border-bottom: 1.2px solid var(--ink); background: transparent; padding: 6px 2px; margin-top: 26px; font-family: var(--serif); font-size: 18px; font-style: italic; }
.search::placeholder { color: var(--muted); }
.search:focus { outline: none; border-bottom-color: var(--cobalt); }

.filters { display: flex; align-items: flex-end; gap: 14px; margin-top: 20px; }
.pick { flex: 1 1 0; min-width: 0; display: grid; gap: 3px; position: relative; }
.pick .caps { font-size: 10.5px; letter-spacing: 0.24em; }
.pick select { appearance: none; -webkit-appearance: none; width: 100%; min-width: 0; border: 0; border-bottom: 1px solid var(--rule, rgba(40,30,20,.35)); border-radius: 0; background: transparent;
  font-family: var(--serif); font-size: 17px; color: var(--ink); padding: 5px 22px 6px 1px; cursor: pointer; text-overflow: ellipsis; }
.pick::after { content: ""; position: absolute; right: 5px; bottom: 15px; width: 6px; height: 6px; border-right: 1.2px solid var(--ink); border-bottom: 1.2px solid var(--ink); transform: rotate(45deg); pointer-events: none; }
.pick select:focus-visible { outline: none; border-bottom-color: var(--cobalt); }
.pick.on select { color: var(--cobalt); border-bottom-color: var(--cobalt); }
.pick.on::after { border-color: var(--cobalt); }
.filters .clear { flex: none; padding-bottom: 8px; font-size: 15px; }
.chip { border: 0; background: none; font-family: var(--serif); font-size: 17px; padding: 3px 7px; color: var(--ink); position: relative; }
.chip[aria-pressed="true"]::after { content: ""; position: absolute; inset: -1px -4px; border: 1.3px solid var(--cobalt); border-radius: 55% 45% 60% 40% / 60% 50% 45% 50%; transform: rotate(-3deg); }

/* plates grid */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 16px; margin-top: 30px; }
@media (min-width: 620px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { border: 0; background: none; padding: 0; text-align: left; display: grid; gap: 6px; min-width: 0; color: inherit; }
.dish { position: relative; display: block; width: 100%; aspect-ratio: 1; max-width: 100%; }
.dish > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.dish .plate { filter: drop-shadow(0 7px 7px var(--shadow)); }
.dish .doodle { pointer-events: none; }
.tile .fav { position: absolute; right: 0; top: 0; width: 26px; height: 26px; color: var(--oxblood); }
.tile h3 { margin: 4px 0 0; font-family: var(--hand); font-weight: 400; font-size: 20px; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
.tile .meta { font-size: 14px; }
.tag-mini { font-family: var(--serif); font-style: normal; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--oxblood); }
@media (prefers-reduced-motion: no-preference) {
  .tile .plate { transition: transform .35s ease; transform-origin: 50% 50%; }
  .tile:hover .plate { transform: rotate(-7deg); }
}

.empty { margin-top: 34px; max-width: 36ch; }
.empty h2 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 24px; margin: 0 0 4px; }
.empty p { margin: 0; }
.note-line { margin-top: 18px; font-size: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.link { border: 0; background: none; padding: 0; color: var(--oxblood); font-family: var(--serif); font-size: 15px; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

.btn { border: 1.3px solid var(--ink); background: transparent; padding: 7px 16px; font-family: var(--serif); font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px; display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
.btn.solid { background: var(--ink); color: var(--paper); }
.btn:disabled { opacity: .45; cursor: default; }
svg.i { width: 18px; height: 18px; flex: none; }

/* recipe page */
.rbar { display: flex; justify-content: space-between; align-items: center; height: 58px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: linear-gradient(var(--paper) 78%, rgb(238 231 217 / 0)); }
.back { border: 0; background: none; padding: 0; display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
.back svg { width: 34px; height: 18px; }
.heart { border: 0; background: none; width: 38px; height: 38px; padding: 5px; color: var(--oxblood); }
.hero { display: grid; gap: 4px; }
.hero .dish { width: min(78%, 330px); margin: 6px auto 4px; }
.hero h1 { margin: 0; font-family: var(--hand); font-weight: 400; font-size: clamp(31px, 8.2vw, 44px); line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.byline { font-style: italic; color: var(--muted); font-size: 16px; display: flex; flex-wrap: wrap; gap: 0 8px; }
.byline .dot { opacity: .6; }
.tags { display: flex; gap: 2px 12px; flex-wrap: wrap; font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--muted); }
.tags .s { color: var(--season); }
.loops { height: 16px; margin: 18px 0 6px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='16'><path d='M0 11c5 0 7-2 8-5 1-3-1-5-3-4-3 1-2 6 2 8 4 2 9 1 15 1' fill='none' stroke='%232B45A0' stroke-width='1.3' stroke-linecap='round'/></svg>") repeat-x left center; opacity: .85; }
.loops.red { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='16'><path d='M0 11c5 0 7-2 8-5 1-3-1-5-3-4-3 1-2 6 2 8 4 2 9 1 15 1' fill='none' stroke='%238E2F22' stroke-width='1.3' stroke-linecap='round'/></svg>"); }

.controls { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-top: 6px; }
.ctl-right { display: inline-flex; align-items: center; gap: 16px; }
.stepper .caps { margin-right: 4px; }
.lang-pick { position: relative; }
.lang-pick select { appearance: none; -webkit-appearance: none; border: 0; border-bottom: 1px solid rgba(40,30,20,.35); border-radius: 0; background: transparent; font-family: var(--serif); font-size: 15px; color: var(--ink); padding: 3px 18px 3px 1px; cursor: pointer; }
.lang-pick::after { content: ""; position: absolute; right: 4px; top: 9px; width: 5px; height: 5px; border-right: 1.1px solid var(--ink); border-bottom: 1.1px solid var(--ink); transform: rotate(45deg); pointer-events: none; }
.lang-pick select:focus-visible { outline: none; border-bottom-color: var(--cobalt); }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.step-btn { border: 1.1px solid var(--ink); background: none; width: 26px; height: 26px; border-radius: 52% 48% 55% 45% / 48% 55% 45% 52%; display: grid; place-items: center; padding: 0; color: var(--ink); }
.step-btn:disabled { opacity: .3; }
.stepper output { font-family: var(--serif); font-size: 20px; min-width: 2.6ch; text-align: center; color: var(--oxblood); }
.langs { display: inline-flex; gap: 2px 10px; flex-wrap: wrap; }
.langs button { border: 0; background: none; padding: 2px 6px; font-family: var(--serif); font-size: 16px; color: var(--muted); position: relative; }
.langs button[aria-pressed="true"] { color: var(--ink); }
.langs button[aria-pressed="true"]::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: -1px; height: 6px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 6' preserveAspectRatio='none'><path d='M1 4c12-3 25-1 38-2 8 0 14 1 20 0' fill='none' stroke='%232B45A0' stroke-width='1.6' stroke-linecap='round'/></svg>") no-repeat center / 100% 100%; }
.langs .tr { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--muted); }
.status { font-size: 13px; font-style: italic; color: var(--muted); margin: 6px 0 0; }
.status:empty { display: none; }
.status.err { color: var(--oxblood); }

.sec { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 34px; flex-wrap: wrap; }
.sec h2 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase; }
.ings { list-style: none; margin: 10px 0 0; padding: 0; }
.ings li { display: grid; grid-template-columns: 6.8rem minmax(0, 1fr); gap: 0 14px; padding: 0; }
.ings .amt { color: var(--oxblood); text-align: right; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ings .amt small { font-size: 14px; font-style: italic; }
.ings .nm { overflow-wrap: anywhere; min-width: 0; }
.ings .nm i { color: var(--muted); }
.ings .grp { display: block; font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--cobalt); padding-top: var(--rh); }
.ings .grp:first-child { padding-top: 0; }
.steps { list-style: none; margin: 10px 0 0; padding: 0; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; max-width: 64ch; }
.steps li::before { content: counter(s); font-family: var(--serif); font-size: 19px; color: var(--cobalt); line-height: var(--rh); }
.conv { color: var(--oxblood); white-space: nowrap; }
.nota { font-family: var(--pen); color: var(--cobalt); font-size: 23px; line-height: 1.2; margin: 26px 0 0; max-width: none; transform: rotate(-0.6deg); transform-origin: left; }
.nota::before { content: "nota — "; color: var(--oxblood); }
.flag { margin-top: 18px; border-left: 2px solid var(--oxblood); padding: 2px 0 2px 12px; font-size: 15px; }
.flag b { display: block; font-family: var(--serif); font-weight: 500; font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--oxblood); }
.flag.c { border-color: var(--cobalt); } .flag.c b { color: var(--cobalt); }
.flag ul { margin: 2px 0 0; padding-left: 18px; }
.source { margin-top: 30px; padding-top: 12px; border-top: 1px solid rgb(42 38 34 / 0.18); font-size: 15px; display: grid; gap: 2px; }
.source a { color: var(--cobalt); overflow-wrap: anywhere; }
.danger { margin-top: 34px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 15px; color: var(--muted); }

/* shopping */
.shop-add { display: flex; gap: 10px; align-items: flex-end; margin-top: 22px; }
.shop-add input { flex: 1; min-width: 0; border: 0; border-bottom: 1.2px solid var(--ink); background: transparent; padding: 6px 2px; font-family: var(--serif); font-size: 18px; }
.shop-add input:focus { outline: none; border-bottom-color: var(--cobalt); }
.aisle-h { margin-top: 26px; display: flex; justify-content: space-between; align-items: baseline; }
.items { list-style: none; margin: 4px 0 0; padding: 0; }
.item { width: 100%; border: 0; background: none; padding: 0; text-align: left; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 0 10px; align-items: start; color: inherit; line-height: var(--rh); }
.tick { width: 18px; height: 18px; margin-top: 6px; border: 1.3px solid var(--ink); border-radius: 4px 6px 3px 7px; position: relative; }
.tick svg { position: absolute; left: -3px; top: -9px; width: 28px; height: 28px; color: var(--cobalt); }
.item .nm { font-family: var(--serif); font-size: 17px; overflow-wrap: anywhere; }
.item .from { font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--muted); margin-left: 8px; }
.item .q { color: var(--oxblood); white-space: nowrap; font-size: 15px; }
.item[aria-checked="true"] .nm, .item[aria-checked="true"] .q { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--cobalt); text-decoration-thickness: 1.6px; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgb(42 38 34 / 0.35); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto; border-radius: 4px 4px 0 0; background: var(--paper); box-shadow: 0 -8px 24px var(--shadow);
  padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.sheet h2 { margin: 0; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 24px; }
.sheet p { margin: 0; }
.field { display: grid; gap: 4px; }
.field input, .field textarea { border: 0; border-bottom: 1.2px solid var(--ink); background: transparent; padding: 6px 2px; font-family: var(--serif); font-size: 16px; }
.field textarea { min-height: 150px; resize: vertical; border: 1.2px solid rgb(42 38 34 / 0.5); border-radius: 3px; padding: 8px; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--cobalt); }
.checklist { list-style: none; margin: 0; padding: 0; }
.checklist label { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 0 10px; line-height: var(--rh); }
.checklist input { width: 17px; height: 17px; margin-top: 7px; accent-color: var(--ink); }
.checklist b { font-family: var(--serif); font-weight: 500; font-size: 17px; }
.checklist .q { color: var(--oxblood); margin-left: 6px; font-size: 15px; }
.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgb(42 38 34 / 0.1); flex-wrap: wrap; }
.switch { width: 46px; height: 26px; border-radius: 20px; border: 1.3px solid var(--ink); background: transparent; position: relative; padding: 0; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: left .2s; }
.switch[aria-checked="true"] { background: var(--ink); }
.switch[aria-checked="true"]::after { left: 23px; background: var(--paper); }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--paper-2);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs::before { content: ""; position: absolute; left: 0; right: 0; top: -3px; height: 6px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 6' preserveAspectRatio='none'><path d='M0 3c40-2 80 1 130 0s90-2 140 0 90 1 130-1' fill='none' stroke='%232A2622' stroke-width='1.2'/></svg>") no-repeat center / 100% 100%; }
.tabs .in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { border: 0; background: none; color: var(--muted); padding: 4px 0; display: grid; justify-items: center; gap: 1px; font-family: var(--serif); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; position: relative; }
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab .badge { position: absolute; top: 0; left: calc(50% + 8px); background: var(--oxblood); color: var(--paper); font-size: 10px; letter-spacing: 0; border-radius: 48% 52% 50% 50%; min-width: 18px; height: 18px; line-height: 18px; text-align: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%) rotate(-1deg); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 7px 16px; font-family: var(--serif); font-size: 18px; z-index: 30; max-width: calc(100% - 32px); border-radius: 3px; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(24px); } } }
</style>

function marks(R, col) { // japandi brushwork

function localDB(base) {

const PROMPT = `Copy this recipe from an Instagram post (caption text and/or screenshots) into JSON for a recipe book. Accuracy matters more than completeness: never fill a gap.
Keep the recipe in its ORIGINAL language. Do not translate, correct spelling or expand abbreviations.
Reply with only one JSON object:
{"title":string,"lang":"en"|"es"|"de","author":string|null,"servings":number|null,"servingsText":string|null,"time":number|null,"timeText":string|null,
"categories":string[],"seasons":string[],
"ingredients":[{"group":string|null,"q":number|null,"q2":number|null,"u":string|null,"name":string,"sourceName":string|null,"note":string|null,"gpc":number|null,"aisle":string}],
"steps":string[],"notes":string|null,"incomplete":string|null,"interpretations":[{"field":string,"note":string}]}
Rules:
- servings / time: ONLY if the post states them. servingsText / timeText: the post's exact words. Otherwise null.
- One ingredient per thing listed. q = the amount as written, as a decimal ("1 1/2" -> 1.5); q2 only for ranges. If no number is written ("a pinch", "Drizzle", "to taste") q is null and those words go in note. Never invent an amount.
- u: one of g, kg, ml, l, tsp, tbsp, cup, fl_oz, oz, lb, pinch when the text uses it in any language (EL/cda -> tbsp, TL/cdta -> tsp, Tasse/taza -> cup); a count word copied from the post ("cloves", "Zehe", "dientes", "can"); or null.
- name and note use the post's own words. Group headers become group exactly as written.
- gpc: grams per US cup only for things European cooks weigh (flour 125, sugar 200, butter 227, oats 90, rice 185, nuts 120, cocoa 85, grated cheese 100). null otherwise.
- aisle: produce, bakery, dairy, meat, pantry, spices, frozen, drinks or other.
- steps: the post's method in your own words but with EVERY number, time, temperature, pan size, ingredient and piece of equipment kept. Never add a number. Temperatures as {{180C}} / {{350F}} and pan sizes as {{20cm}} / {{9in}} exactly as the post gives them. If the post has no method, steps is [] and incomplete says so.
- Never output emoji anywhere. If the post writes an ingredient as an emoji, put the word in the recipe's language in name, the post's exact text in sourceName, and add an interpretations entry with field "emoji" saying so in words.
- If the post gives a temperature or size without a unit, explain your reading in interpretations.
- categories: one or two of Breakfast, Mains, Soups, Salads, Sides, Baking, Desserts, Snacks, Drinks. seasons: subset of spring, summer, fall, winter.
- notes: tips from the post (storage, serving), or null. Ignore hashtags and promotion.`;
// a light version of the import tests, run against the pasted caption
function importChecks(doc, caption) {
  const w = [], nums = numbersIn(caption);
  for (const i of doc.ingredients) { if (i.q != null && !hasNum(nums, i.q)) w.push(`“${i.name}”: the amount ${i.q} isn't in the caption`); if (i.q2 != null && !hasNum(nums, i.q2)) w.push(`“${i.name}”: the amount ${i.q2} isn't in the caption`); }
  for (const t of (doc.steps.join(" ").match(/\{\{\s*\d+/g) || [])) { const n = +t.replace(/\D/g, ""); if (!hasNum(nums, n)) w.push(`the method mentions ${n}, which isn't in the caption`); }
  if (doc.servings != null && !hasNum(nums, doc.servings)) { w.push(`servings ${doc.servings} isn't in the caption, so it was removed`); doc.servings = null; doc.servingsText = null; }
  if (doc.time != null && !hasNum(nums, doc.time)) { w.push(`the time ${doc.time} min isn't in the caption, so it was removed`); doc.time = null; }

}

    if (!r || !r.title || !Array.isArray(r.ingredients)) throw { code: "invalid_json" };

const TR_PROMPT = (lang, payload) => `Translate this recipe into ${LANG[lang]}. It is a faithful translation for a home cook, not an adaptation.
Rules: translate every string; keep every number, fraction and {{token}} exactly as it is; do not add, drop, explain or round anything; never output emoji; keep the arrays the same length and in the same order; translate count words in "u" (like "cloves", "Zehe") but leave null as null.
Reply with only JSON of exactly this shape: ${JSON.stringify({ title: "", servingsText: null, notes: null, incomplete: null, ingredients: [{ name: "", note: null, group: null, u: null }], steps: [""] })}

${JSON.stringify(payload)}`;
const STD_UNITS = new Set(["g", "kg", "ml", "l", "tsp", "tbsp", "cup", "fl_oz", "oz", "lb", "pinch"]);
function validateTranslation(src, t) {
  const bad = [];
  if (!t || typeof t.title !== "string") return ["no title came back"];
  if (!Array.isArray(t.ingredients) || t.ingredients.length !== src.ingredients.length) bad.push("the ingredient list changed length");
  if (!Array.isArray(t.steps) || t.steps.length !== src.steps.length) bad.push("the number of steps changed");
  (src.steps || []).forEach((s, n) => { const o = t.steps?.[n] || ""; if (tokens(s) !== tokens(o)) bad.push(`step ${n + 1}: a temperature or size changed`); if (digitsOf(s) !== digitsOf(o)) bad.push(`step ${n + 1}: a number changed`); });
  (src.ingredients || []).forEach((i, n) => { const o = t.ingredients?.[n] || {}; if (digitsOf([i.name, i.note].join(" ")) !== digitsOf([o.name, o.note].join(" "))) bad.push(`“${i.name}”: a number changed`); });
  for (const k of ["notes", "servingsText"]) if (src[k] && digitsOf(src[k]) !== digitsOf(t[k])) bad.push(`${k}: a number changed`);
  return bad;
}
async function translate(lang) {
  const r = recipeById(S.detail); const st = document.getElementById("tr-status");
  if (!S.sample) { st.className = "status err"; st.textContent = "Translating needs Claude. Ask in chat and it arrives with the next update."; return; }
  const payload = { title: r.title, servingsText: r.servingsText || null, notes: r.notes || null, incomplete: r.incomplete || null,
    ingredients: r.ingredients.map(i => ({ name: i.name, note: i.note || null, group: i.group || null, u: i.u && !STD_UNITS.has(i.u.toLowerCase()) ? i.u : null })), steps: r.steps || [] };
  st.className = "status"; st.textContent = `Claude is translating into ${LANG[lang]}…`;
  try {
    const t = await S.sample.json(TR_PROMPT(lang, payload));
    const bad = validateTranslation(payload, t);
    if (bad.length) { st.className = "status err"; st.textContent = "Not saved: the translation changed something (" + bad.slice(0, 2).join("; ") + "). Try again."; return; }
    const clean = { title: t.title, servingsText: t.servingsText ?? null, notes: t.notes ?? null, incomplete: t.incomplete ?? null, steps: t.steps,
      ingredients: t.ingredients.map((x, n) => { const o = { name: String(x.name || r.ingredients[n].name), note: x.note ?? null, group: x.group ?? null }; if (payload.ingredients[n].u && x.u) o.u = String(x.u); return o; }), at: Date.now() };
    await S.db.doc("recipes/" + r.id).update({ translations: { [lang]: clean } });
    S.viewLang = lang; render();
  } catch (e) {
    st.className = "status err";
    st.textContent = e?.code === "not_granted" ? "Claude wasn't allowed to help on this page." : e?.code === "rate_limited" ? "Too many requests. Try again in a minute." : "The translation didn't finish. Try again.";
  }
}

// ---------- toast ----------
let tt;
function toast(msg) { let el = document.querySelector(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.append(el); } el.textContent = msg; clearTimeout(tt); tt = setTimeout(() => el.remove(), 2800); }

// ---------- events ----------
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act, v = t.dataset.v;
  if (act === "scrim" && e.target !== t) return;
  switch (act) {
    case "units": S.units = v; save("olla-units", v); render(); break;
    case "tab": S.view = v; S.detail = null; S.confirmClearAll = false; render(); window.scrollTo(0, 0); break;
    case "season": S.season = v || null; render(); break;
    case "cat": S.cat = v || null; render(); break;
    case "clear-filters": S.season = null; S.cat = null; render(); break;
    case "open": { S.detail = t.dataset.id; S.servings = null; S.mult = 1; S.confirmDelete = null; const r = recipeById(S.detail); S.viewLang = S.prefLang !== "orig" && r?.translations?.[S.prefLang] ? S.prefLang : null; render(); window.scrollTo(0, 0); break; }
    case "back": S.detail = null; render(); break;
    case "sv": { const r = recipeById(S.detail); if (r.servings) S.servings = Math.max(1, (S.servings || r.servings) + Number(v)); else S.mult = Math.max(.5, S.mult + Number(v) * .5); render(); break; }
    case "lang": { const r = recipeById(S.detail); if (v === "orig") { S.viewLang = null; render(); } else if (r.translations?.[v]) { S.viewLang = v; render(); } else translate(v); break; }
    case "fav": { const r = recipeById(S.detail); try { await S.db.doc("recipes/" + r.id).update({ favorite: !r.favorite }); } catch { toast("Couldn't save. Try again."); } break; }
    case "del": S.confirmDelete = S.detail; render(); break;
    case "del-no": S.confirmDelete = null; render(); break;
    case "del-yes": { const id = S.detail; S.detail = null; S.confirmDelete = null; render(); try { await S.db.doc("recipes/" + id).delete(); toast("Page torn out"); } catch { toast("Couldn't delete. Try again."); } break; }
    case "clear-examples": await Promise.all(S.recipes.filter(r => r.example).map(r => S.db.doc("recipes/" + r.id).delete().catch(() => {}))); toast("Examples removed"); break;
    case "add-shop": openShopSheet(); break;
    case "settings": openSettings(); break;
    case "flag-src": { const on = !S.settings.showSourceLink; S.settings = { ...S.settings, showSourceLink: on }; openSettings(); render(); try { await S.db.doc("settings/app").set({ showSourceLink: on }); } catch { toast("Couldn't save the setting."); } break; }
    case "pref-lang": S.prefLang = v; save("olla-lang", v); openSettings(); render(); break;
    case "close": case "scrim": closeSheet(); break;
    case "shop-confirm": {
      const r0 = recipeById(S.detail); const f = factorOf(r0);
      const picks = [...layer.querySelectorAll("input[data-n]:checked")].map(x => r0.ingredients[+x.dataset.n]);
      closeSheet(); const now = Date.now();
      try { await Promise.all(picks.map((i, k) => S.db.collection("shopping").add({ name: i.name, q: i.q == null ? null : i.q * f, q2: null, u: i.u || null, gpc: i.gpc || null, aisle: i.aisle || "other", recipeId: r0.id, recipeTitle: r0.title, checked: false, createdAt: now + k }))); toast(`${picks.length} on the list`); }
      catch { toast("Some items didn't save. Try again."); }
      break;
    }
    case "toggle": { const ids = t.dataset.ids.split(","); const to = t.dataset.c !== "true"; try { await Promise.all(ids.map(id => S.db.doc("shopping/" + id).update({ checked: to }))); } catch { toast("Couldn't update. Try again."); } break; }
    case "clear-done": await Promise.all(S.shop.filter(i => i.checked).map(i => S.db.doc("shopping/" + i.id).delete().catch(() => {}))); break;
    case "clear-all": S.confirmClearAll = true; render(); break;
    case "clear-all-no": S.confirmClearAll = false; render(); break;
    case "clear-all-yes": S.confirmClearAll = false; await Promise.all(S.shop.map(i => S.db.doc("shopping/" + i.id).delete().catch(() => {}))); toast("A fresh list"); break;
    case "import": openImport(); break;
    case "import-go": runImport(); break;
  }
});
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById("q"); q.focus(); try { q.setSelectionRange(pos, pos); } catch {} } });
document.addEventListener("change", e => { if (e.target.hasAttribute?.("data-lang")) { const v = e.target.value, r = recipeById(S.detail); if (v === "orig") { S.viewLang = null; render(); } else if (r.translations?.[v]) { S.viewLang = v; render(); } else translate(v); return; } const f = e.target.dataset?.filter; if (f) { S[f] = e.target.value || null; render(); document.querySelector(`[data-filter="${f}"]`)?.focus(); } });
document.addEventListener("submit", async e => {
  if (e.target.id !== "shop-form") return; e.preventDefault();
  const inp = document.getElementById("shop-new"); const name = inp.value.trim(); if (!name || !S.db) return; inp.value = "";
  try { await S.db.collection("shopping").add({ name, q: null, u: null, gpc: null, aisle: "other", recipeId: null, recipeTitle: null, checked: false, createdAt: Date.now() }); } catch { toast("Couldn't add that. Try again."); }
  document.getElementById("shop-new")?.focus();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && layer.innerHTML) closeSheet(); });

boot();
})();
</script>
